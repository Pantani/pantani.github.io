name: Portfolio SEO and Pages

on:
  push:
    branches: [main, pantani/portfolio-seo]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'scripts/requirements-*.txt'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build and validation dependencies
        run: |
          python -m pip install -r scripts/requirements-site.txt -r scripts/requirements-cv.txt -r scripts/requirements-seo-tools.txt
          npm ci
      - name: Test source and locale behavior
        run: |
          python -m unittest discover -s tests -v
          npm test
          npm run lint
      - name: Check generator complexity
        run: |
          ruff check scripts/build_site.py scripts/site_content.py scripts/site_metadata.py scripts/validate_site.py tests/test_site.py
          complexipy scripts/build_site.py scripts/site_content.py scripts/site_metadata.py scripts/validate_site.py tests/test_site.py --max-complexity-allowed 10 --check-script --no-ignore
      - name: Build and validate public artifact
        run: |
          python scripts/build_site.py --output _site
          python scripts/validate_site.py --directory _site
      - name: Upload public artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
